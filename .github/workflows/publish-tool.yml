name: Publish NuGet Tool

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the short-lived OIDC token that NuGet trusted publishing
      # exchanges for a temporary push key, so no long-lived secret is stored.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack
        run: dotnet pack -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      # Trusted publishing: exchanges the job's OIDC token for a key that lives minutes rather
      # than months. v0.1.3 failed on an expired stored key, which is the failure mode this
      # removes rather than postpones. The trust policy on nuget.org keys on this repository
      # and this workflow FILENAME, so renaming this file breaks publishing.
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
